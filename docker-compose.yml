# ============================================================
# MyMoviz Notify Bot - Docker Compose
# Usage:
#   cp .env.example .env  # then edit values
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
# ============================================================

version: "3.9"

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mymoviz-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist SQLite DB and logs across container restarts
      - ./data:/app/data
      - ./logs:/app/logs
    ports:
      # Only used in webhook mode; long-polling doesn't need a port
      - "${WEBHOOK_PORT:-8443}:${WEBHOOK_PORT:-8443}"
    networks:
      - mymoviz-net
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.path.exists('/app/data/mymoviz.db')"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M

networks:
  mymoviz-net:
    driver: bridge
